pluginManagement {
    repositories {
        google { content { includeGroupByRegex('com\\.android.*'); includeGroupByRegex('androidx\\..*'); includeGroupByRegex('com\\.google\\.testing.*') } }
        mavenCentral()
        gradlePluginPortal()
    }
    resolutionStrategy { eachPlugin {
        if (requested.id.id == 'com.android.application') useModule("com.android.tools.build:gradle:${requested.version}")
    } }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google { content { includeGroupByRegex('androidx\\..*'); includeGroupByRegex('com\\.android.*'); includeGroupByRegex('com\\.google\\.testing.*') } }
        mavenCentral()
    }
}
rootProject.name = 'CaraDeVerga'
include ':app'
