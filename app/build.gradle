plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.kapt'
}
def signingFile = rootProject.file('signing/keystore.properties')
def signingProps = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
android {
    namespace 'com.aura.caradeverga'
    compileSdk 35
    compileSdkExtension 15
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.aura.caradeverga'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { compose true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.includeAndroidResources = true }
    signingConfigs {
        if (signingFile.exists()) release {
            storeFile rootProject.file('signing/caradeverga-release.jks')
            storePassword signingProps.getProperty('storePassword')
            keyAlias 'caradeverga'
            keyPassword signingProps.getProperty('keyPassword')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
}
kapt { arguments { arg('room.schemaLocation', "$projectDir/schemas") } }
dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui:1.7.6'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.6'
    implementation 'androidx.compose.material3:material3:1.3.1'
    implementation 'androidx.compose.material:material-icons-core:1.7.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.6'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.compose.ui:ui-test-junit4:1.7.6'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.7.6'
}
tasks.withType(Test).configureEach {
    maxHeapSize = '1536m'
    maxParallelForks = 1
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort','http.nonProxyHosts'].each { key ->
        if (System.getProperty(key)) systemProperty key, System.getProperty(key)
    }
}
